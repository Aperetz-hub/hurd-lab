[workspace]
resolver = "2"
members = ["crates/hurd-riscv64-boot"]

[profile.release]
# A boot image is debuggable by default: the whole point of the first
# milestones is to look at panics and SBI return values.
opt-level = "s"
lto = true
codegen-units = 1
overflow-checks = true
debug = true
panic = "abort"