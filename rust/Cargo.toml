[workspace]
resolver = "2"
members = [
    "crates/hurd-mig-sys",
    "crates/hurd-mig-example",
]

# Nothing here is published.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
license = "GPL-3.0-or-later"
publish = false

# `panic = "abort"` is required, not stylistic.
#
# `hurd-mig-example` is `#![no_std] #![no_main]`, so it defines its own
# `#[panic_handler]` and links no unwinder. With the default `panic = "unwind"`
# rustc refuses:
#
#     error: unwinding panics are not supported without std
#
# Cargo applies the `panic` setting to the binary but keeps unwinding for test
# targets, which is exactly what is needed here: the shipped artefact aborts,
# while `cargo test` still gets a working harness. (The alternative --
# rebuilding `core` with `-Z build-std` -- is only needed when you also want
# `alloc` on a `none` target, see rust-toolchain.toml.)
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
overflow-checks = true