[toolchain]
# Nightly because the documented workflow rebuilds `core`/`alloc` from source
# (-Z build-std). If you only want the uncommented POC to build, a recent
# *stable* toolchain works too: `core` and `alloc` are both shipped prebuilt for
# x86_64-unknown-linux-gnu, which is the target used for the Hurd POC.
channel = "nightly"
components = ["rust-src", "rustfmt", "clippy"]
targets = ["x86_64-unknown-linux-gnu"]
profile = "minimal"