# Cargo configuration for the Rust / Mach-MIG work.
#
# The POC targets x86_64-unknown-linux-gnu on purpose: it runs on the *host*
# toolchain, not inside the Hurd guest yet. See README.md for how the same
# crate is later cross-compiled for the guest.

[build]
# Uncomment to cross-compile the POC for the Hurd guest. That additionally
# needs a Hurd sysroot and the translator startup files; see
# docs/roadmap-riscv-rust.md, section 5.2.
# target = "x86_64-unknown-hurd"

[target.x86_64-unknown-linux-gnu]
# Hurd's Mach headers and MIG stubs use the LP64 layout on both sides, so the
# defaults here already match what bindgen sees. Keep this section in sync with
# the C side (-m64) or every struct offset in the generated bindings will be
# wrong.
#
# Do NOT add `-C target-feature=+soft-float` here: it is meaningless on x86_64,
# which always uses SSE for floating point. It also applies to build scripts,
# and with it present every build script in this workspace segfaulted during
# `cargo check`.
#
# Overflow checks are worth having and cost nothing here: the message layer
# indexes byte arrays, which is exactly the kind of code where a silent wrap
# becomes a memory-safety bug rather than a wrong number.
rustflags = [
    "-C", "overflow-checks=on",
    # A `#![no_std] #![no_main]` crate is still a *hosted* program here, so it
    # has to name the platform C library: rustc links a freestanding crate with
    # `-nodefaultlibs`, and without this the link fails on malloc/free/write/exit.
    # On Hurd the equivalent is linking libhurd-dev, which also supplies the
    # translator interface and its startup files.
    "-C", "link-arg=-lc",
]

# NOTE: there is deliberately NO `[unstable] build-std` section.
#
# Listing it here turns standard-library rebuilding ON BY DEFAULT for every
# build in the workspace, and cargo then builds its own `core` on top of the
# prebuilt one, which fails with:
#
#     error[E0152]: duplicate lang item in crate `core`: `sized`
#
# Rebuilding the standard library is opt-in and explicit instead:
#
#     cargo +nightly build -Z build-std=core,alloc,compiler_builtins \
#          -Z build-std-features=compiler-builtins-mem
#
# See rust-toolchain.toml for why that also needs a nightly toolchain.