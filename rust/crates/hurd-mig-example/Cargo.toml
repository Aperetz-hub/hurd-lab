[package]
name = "hurd-mig-example"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Minimal no_std + alloc Hurd translator/sandbox speaking a MIG-shaped protocol"

[dependencies]
# `runtime` (and therefore the Mach calls) is opt-in: without it the crate
# compiles and runs on the host, which is what CI and the logic tests need.
hurd-mig-sys = { path = "../hurd-mig-sys", features = ["alloc-support"] }

[features]
default = []
# Enable the real Mach transport. Only valid on a Mach system (i.e. inside the
# Hurd guest); see docs/roadmap-riscv-rust.md, section 5.2.
mach = ["hurd-mig-sys/runtime"]

# Two targets, on purpose:
#
#   lib -- all the logic, always `#![no_std]`, carries the test suite.
#   bin -- the process: global allocator, entry point, panic handler.
#
# The binary must NOT be tested: its test target would link `std` for the
# harness, and the crate defines its own `#[panic_handler]`, which fails with
# "duplicate lang item `panic_impl`". There is nothing to test there anyway --
# every line of it is process plumbing. `test = false` and `bench = false` are
# therefore required, not an optimisation.
[[bin]]
name = "hurd-mig-example"
path = "src/main.rs"
test = false
bench = false

# No `std` dependency, and none is wanted: `alloc` comes from the toolchain and
# `extern crate alloc;` in src/lib.rs is enough to reach it. Profiles belong to
# the workspace root, so there is deliberately none here.